name: ci

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Daily, full-N. The per-push `findings` job below cuts every predicate's
    # game count (FINDINGS_SEEDS=12) so pushes stay fast, and at that sample
    # size two findings read STALE routinely -- so a green push does not mean
    # a headline is current, only that the wiring runs. hf7y/american-cycle#22.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      # Full history, because a findings stamp names a commit and the guard
      # that resolves it can only stand down on a depth-1 checkout -- which
      # would make skipping the check the CI default, and green would again
      # not be evidence.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci || npm install
      - name: typecheck
        run: npx tsc --noEmit
      # The findings half of this used to be the shape checks ONLY: the two
      # deep checks -- that a declared config dependency is actually read back,
      # and that every claim is finite -- sit behind FINDINGS_DEEP because they
      # re-run every predicate, and nothing set it. So one of them was failing
      # on main and CI was green: historical-push declared as-written-plus.json
      # and no claim checked it. That is #22's point exactly, so CI now sets it.
      # FINDINGS_SEEDS cuts the game counts, which is what it is for -- this
      # asks "does the wiring hold", not "does a headline hold" at full N.
      - name: tests
        run: npm test
        env:
          FINDINGS_DEEP: '1'
          FINDINGS_SEEDS: 12
      # Findings are predicates, not prose. A stale headline is information
      # rather than a failure, so this reports drift and only fails on BROKEN.
      # At a cut sample size, so this asks "does every predicate still run",
      # not "does every headline still hold" — that is a full-N question and
      # the answer moves, so it is asked by hand: `node sim/findings.ts`.
      - name: findings still re-derive
        run: node sim/findings.ts
        env:
          FINDINGS_SEEDS: 12
      - name: every named rule fires at least once
        run: node sim/coverage.ts

  # hf7y/american-cycle#22: the job above cuts every predicate's game count
  # so pushes stay fast, and at that sample size staleness is routine -- so
  # its green badge is evidence the wiring runs, not that a headline holds.
  # This runs the same predicates at their real, full N, on a schedule and on
  # demand, and surfaces the STALE count in the job summary rather than
  # leaving it buried in a log nobody reads. It still only FAILS the job on
  # BROKEN or an unstampable claim, matching CLAUDE.md's own rule that STALE
  # is information, not failure.
  findings-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci || npm install
      - name: findings at full N
        run: |
          set -o pipefail
          node sim/findings.ts | tee findings-full.log
      - name: surface the stale count
        if: always()
        run: |
          [ -f findings-full.log ] || exit 0
          summary_line=$(tail -1 findings-full.log)
          {
            echo "### Findings at full N"
            echo ""
            echo "$summary_line"
            echo ""
            echo '<details><summary>full findings output</summary>'
            echo ''
            echo '```'
            cat findings-full.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          stale=$(echo "$summary_line" | grep -oE '[0-9]+ stale' | grep -oE '^[0-9]+' || true)
          if [ "${stale:-0}" -gt 0 ]; then
            echo "::warning title=Findings drifted::${stale} finding(s) are STALE at full N -- a headline no longer matches the engine. See the job summary."
          fi

  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci || npm install
      # The bundler refuses to emit a page whose scripts declare colliding
      # top-level names. That is not a style check: a collision renders the
      # board BLANK, and one shipped before this existed.
      - name: build the board
        run: node ui/build.ts
      # The browser tests below run against the bundle CI just built, so a STALE
      # COMMITTED bundle passes them silently -- while the board a player loads
      # is the committed one. #60 changed sim/agents.ts without rebuilding, and
      # the shipped board kept running a BillMaximizer that no longer existed in
      # source: the board and the simulator playing different games, which is
      # exactly the bug #29 was opened for.
      - name: the committed board is current
        run: git diff --exit-code ui/index.html

      - name: playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
      # The engine tests exercise the engine. These exercise the page, which is
      # where three bugs hid that nothing else could see.
      - name: play a full game in a browser
        run: python3 sim/playtest.py
      - name: both themes, both widths, every rule set and era
        run: python3 sim/playtest-matrix.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: /tmp/american-cycle-shots/*.png
          if-no-files-found: ignore

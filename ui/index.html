<title>American Cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#E8E6E1; --paper-2:#DEDBD4; --card:#F2F0EC; --ink:#16181A; --ink-2:#4A4E54;
  --rule:#C4BFB6; --brass:#8A6D22; --dem:#2F5C8A; --gop:#A63A2E;
  --dem-soft:#D6DFE9; --gop-soft:#EBD6D1; --good:#3E6B4F; --warn:#8A6D22; --bad:#A63A2E;
  --shadow:0 1px 0 rgba(22,24,26,.06),0 2px 8px rgba(22,24,26,.07);
  --chyron-bg:#16181A; --chyron-fg:#E8E6E1;
  --display:"Archivo Narrow",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161A; --paper-2:#1B1E23; --card:#20242A; --ink:#E6E3DC; --ink-2:#9AA0A8;
  --rule:#33373D; --brass:#C9A44C; --dem:#6E9CC9; --gop:#D2705F;
  --dem-soft:#22303D; --gop-soft:#3A2622; --good:#6FA07E; --warn:#C9A44C; --bad:#D2705F;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.5);
  --chyron-bg:#0C0E11; --chyron-fg:#E6E3DC;
}}
:root[data-theme="dark"]{
  --paper:#14161A; --paper-2:#1B1E23; --card:#20242A; --ink:#E6E3DC; --ink-2:#9AA0A8;
  --rule:#33373D; --brass:#C9A44C; --dem:#6E9CC9; --gop:#D2705F;
  --dem-soft:#22303D; --gop-soft:#3A2622; --good:#6FA07E; --warn:#C9A44C; --bad:#D2705F;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.5);
  --chyron-bg:#0C0E11; --chyron-fg:#E6E3DC;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}

/* chyron ------------------------------------------------------------------ */
#chyron{position:sticky;top:0;z-index:20;display:flex;align-items:stretch;gap:0;
  background:var(--chyron-bg);color:var(--chyron-fg);border-bottom:2px solid var(--brass)}
.chy{padding:8px 14px;border-right:1px solid rgba(255,255,255,.14);display:flex;
  flex-direction:column;justify-content:center;min-width:0}
.chy .k{font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.chy .v{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap}
.chy.grow{flex:1;border-right:none;overflow:hidden}
#ticker{font-family:var(--mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout ------------------------------------------------------------------ */
#wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;
  grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){#wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:2px;box-shadow:var(--shadow)}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--rule)}
.panel>.body{padding:12px}

/* map --------------------------------------------------------------------- */
#map{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.st{position:relative;aspect-ratio:1;border:1px solid var(--rule);border-radius:1px;
  background:var(--paper-2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600;
  transition:transform .12s ease,box-shadow .12s ease}
.st.act{cursor:pointer}
.st.act:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:2}
.st.sel{outline:2px solid var(--brass);outline-offset:1px}
.st .pips{display:flex;gap:1px;height:4px;margin-top:2px}
.st .pip{width:3px;height:3px;border-radius:50%}
.st .peg{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;border:1px solid var(--card)}
.st.race::after{content:"";position:absolute;inset:0;border:2px solid var(--brass);border-radius:1px;pointer-events:none}

/* cards ------------------------------------------------------------------- */
#hand{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.cc{flex:0 0 152px;background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--rule);
  border-radius:2px;padding:8px;font-size:12px;cursor:pointer;transition:transform .12s ease}
.cc:hover{transform:translateY(-3px)}
.cc.sel{outline:2px solid var(--brass);outline-offset:1px}
.cc.D{border-top-color:var(--dem)} .cc.R{border-top-color:var(--gop)}
.cc .nm{font-family:var(--display);font-size:14px;font-weight:600;line-height:1.15}
.cc .mt{color:var(--ink-2);font-size:10px;font-family:var(--mono);margin-top:2px}
.cc .bel{font-size:11px;font-style:italic;color:var(--ink-2);margin-top:5px;line-height:1.3}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;padding:1px 4px;border:1px solid var(--rule);
  border-radius:1px;margin:3px 3px 0 0;text-transform:uppercase;letter-spacing:.04em}
.tag.het{border-color:var(--brass);color:var(--brass)}
.tag.ext{border-color:var(--gop);color:var(--gop)}

/* log --------------------------------------------------------------------- */
#log{max-height:460px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:0}
.le{padding:7px 12px;border-bottom:1px solid var(--rule);line-height:1.4}
.le:last-child{border-bottom:none}
.le .yr{font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.05em}
.le.big{background:var(--paper-2)}
.le b{font-weight:600}

/* dice -------------------------------------------------------------------- */
.dice{display:flex;gap:6px;margin-top:6px}
.die{flex:1;text-align:center;border:1px solid var(--rule);border-radius:2px;padding:4px 2px;background:var(--paper-2)}
.die .n{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1}
.die .l{font-family:var(--display);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
@keyframes tumble{0%{transform:translateY(-6px) rotate(-8deg);opacity:0}60%{transform:none;opacity:1}100%{transform:none}}
.die.roll{animation:tumble .34s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}.st,.cc{transition:none}}

/* stack ------------------------------------------------------------------- */
.stack{font-family:var(--mono);font-size:12px;border-collapse:collapse;width:100%}
.stack td{padding:2px 0;border-bottom:1px dotted var(--rule)}
.stack td:last-child{text-align:right;font-weight:600}
.stack tr.tot td{border-top:1px solid var(--ink);border-bottom:none;padding-top:5px;font-weight:600}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* controls ---------------------------------------------------------------- */
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:2px;
  padding:8px 16px;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase}
.btn:hover{background:var(--brass);border-color:var(--brass);color:#14161A}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--paper-2);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=number]{font:inherit;font-family:var(--mono);font-size:13px;padding:6px 8px;
  background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px}

/* modal ------------------------------------------------------------------- */
#modal{position:fixed;inset:0;background:rgba(10,12,14,.62);display:none;place-items:center;z-index:40;padding:16px}
#modal.on{display:grid}
#modalBox{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--brass);
  border-radius:2px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#modalBox>div{padding:18px}
.scores{display:flex;gap:6px;flex-wrap:wrap}
.sc{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--rule);border-radius:2px;background:var(--paper-2)}
.sc.me{border-color:var(--brass);font-weight:600}
.note{font-size:12px;color:var(--ink-2);line-height:1.45}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.setup-grid{grid-template-columns:1fr}}
</style>

<div id="chyron">
  <div class="chy"><span class="k">Year</span><span class="v" id="cYear">—</span></div>
  <div class="chy"><span class="k">Economy</span><span class="v" id="cEcon">—</span></div>
  <div class="chy"><span class="k">Spending</span><span class="v" id="cG">—</span></div>

</div>

<div id="wrap">

    </section>
    <section class="panel">
      <header><h2 style="font-size:15px">Your hand</h2><span class="eyebrow" id="handHint">—</span></header>
      <div class="body"><div id="hand"></div><div class="row" style="margin-top:10px" id="controls"></div></div>
    </section>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <section class="panel">
      <header><h2 style="font-size:15px">Standings</h2><span class="eyebrow" id="cfgName">—</span></header>
      <div class="body"><div class="scores" id="scores"></div></div>
    </section>
    <section class="panel">
      <header><h2 style="font-size:15px">Election night</h2><span class="eyebrow">as it comes in</span></header>
      <div id="log"></div>
    </section>
  </div>
</div>

/** Class 3 elects in 2022/2016, class 1 in 2024/2018, class 2 in 2026/2020. */
const SENATE_CLASS_YEAR                            = { 1: 2024, 2: 2026, 3: 2022 };

function senateUp(s          , year        )                {
  return s.senateClasses.filter((c) => (year - SENATE_CLASS_YEAR[c]) % 6 === 0);
}

function governorUp(s          , year        )          {
  const d = year - s.govAnchor;
  return d % s.govTerm === 0;
}

/** seats for the apportionment in force in `year` */
function seatsIn(s          , year        )         {
  const censuses = Object.keys(s.seats).map(Number).sort((a, b) => a - b);
  let n = s.seats[censuses[0]];
  for (const c of censuses) if (year >= c + 2) n = s.seats[c];
  return n;
}

// seats: 1970 census (in force 1972-1982) and 2010 census (2012-2022).

/** Electoral votes = delegation + 2. DC's three are added as a flat constant. */
const DC_ELECTORS = 3;
function electors(s          , year        )         { return seatsIn(s, year) + 2; }
function totalElectors(year        )         {

/** Seeded RNG. BUILD-BRIEF: every game runs from a seed so a bug is reproducible. */
class RNG {
          s        ;
  constructor(seed        ) { this.s = (seed >>> 0) || 1; }
  /** mulberry32 — small, fast, good enough for dice */
  next()         {
    this.s = (this.s + 0x6d2b79f5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  d6()         { return 1 + Math.floor(this.next() * 6); }
  int(n        )         { return Math.floor(this.next() * n); }
  pick   (xs     )    { return xs[this.int(xs.length)]; }
  shuffle   (xs     )      {
    for (let i = xs.length - 1; i > 0; i--) { const j = this.int(i + 1); [xs[i], xs[j]] = [xs[j], xs[i]]; }
    return xs;
  }
  bool()          { return this.next() < 0.5; }
}

/** Election resolution — design doc §9, with the three labeled dice of §4.
 *
 *  HOW THE DICE ARE WIRED, and why. §3 fixes the spread: "the difference
 *  between two 3d6 rolls has a standard deviation of 4.18 pips", and Zach
 *  confirmed the dice are correct. That only holds if each SIDE rolls its own
 *  three dice — six in a race. §4's "same value for every race in the cycle"
 *  is therefore per PARTY, not per race: a party rolls one national die for
 *  the cycle and reuses it across all its races, and one state die per state.
 *  Within a race the two sides hold different values so nothing cancels;
 *  across races a party's results are correlated, which is exactly what a wave
 *  is. Rolling one shared national die per race would cancel it out entirely
 *  and collapse the spread to 2.42 pips, breaking the odds table.
 */
                                                                                             
                                    

                       
                 
                 
               
                        
                                                                            
                                                                            
                      
 

/** A cycle's dice, drawn once and reused so waves correlate across races. */
class Wave {
          national = new Map               ();
          state = new Map                ();
          rng     ;
  /** Counts dice actually drawn. The withdrawal-window test asserts this is
   *  still zero when the window closes -- BUILD-BRIEF calls that the single
   *  most important rule in the game and the easiest to implement wrong. */
  rolls = 0;
  constructor(rng     ) { this.rng = rng; }
  nationalDie(p       )         {
    if (!this.national.has(p)) { this.national.set(p, this.rng.d6()); this.rolls++; }
    return this.national.get(p) ;
  }
  stateDie(p       , st        )         {
    const k = `${p}:${st}`;
    if (!this.state.has(k)) { this.state.set(k, this.rng.d6()); this.rolls++; }
    return this.state.get(k) ;
  }
  roll(p       , st        , rng     )           {
    const n = this.nationalDie(p), st2 = this.stateDie(p, st);
    this.rolls++;
    return { national: n, state: st2, candidate: rng.d6() };
  }
}

function effectiveModifiers(s      )             {
  return s.heterodox ? s.modifiers.filter((m) => !m.national) : s.modifiers;
}

function modifierTotal(s      )         {
  return effectiveModifiers(s).reduce((n, m) => n + m.pips, 0);
}

                              
                                                                           
                                      
 

function resolveRace(a             )            {
  const scored = a.sides.map((s) => {
    const dice = a.wave.roll(s.party, a.state, a.rng);
    const mt = modifierTotal(s);
    return {
      player: s.player, cardId: s.cardId, party: s.party, dice,
      modifiers: effectiveModifiers(s), modifierTotal: mt,
      total: dice.national + dice.state + dice.candidate + mt,
    };
  });

  const uncontested = scored.length === 1;
  // §8: a player who fields nobody loses; uncontested is an auto-win.
  const ranked = [...scored].sort((x, y) => y.total - x.total);
  let winner = ranked[0].player;
  // Ties: the doc says only "higher total wins". Placeholder = even break,
  // which is what makes edge 0 exactly 50%. Flagged in DECISIONS.md as open.
  if (ranked.length > 1 && ranked[0].total === ranked[1].total) {
    winner = a.rng.bool() ? ranked[0].player : ranked[1].player;
  }
  const margin = ranked.length > 1 ? ranked[0].total - ranked[1].total : 0;

  const byMods = [...scored].sort((x, y) => y.modifierTotal - x.modifierTotal);
  const zeroDiceWinner = byMods[0].player;

  return {
    year: a.year, round: a.round, office: a.office, state: a.state, slot: a.slot,
    sides: scored, winner, margin,
    zeroDiceWinner,
    upset: !uncontested && winner !== zeroDiceWinner,
    uncontested,
  };
}

/** Exact win probability at a given pip edge, 3d6 vs 3d6, ties broken evenly.
 *  This is the table in §3 and the foundation test asserts against it. */
function oddsAtEdge(edge        )         {
  const d3           = new Array(19).fill(0);
  for (let i = 1; i <= 6; i++) for (let j = 1; j <= 6; j++) for (let k = 1; k <= 6; k++) d3[i + j + k]++;
  let win = 0, tie = 0;
  for (let a = 3; a <= 18; a++) {
    for (let b = 3; b <= 18; b++) {
      const w = d3[a] * d3[b];
      if (a + edge > b) win += w; else if (a + edge === b) tie += w;
    }
  }
  return (win + tie / 2) / (216 * 216);
}


// ---- engine/rules/lean.ts ----
/** State lean — design doc §10. Signed pips: positive = R, negative = D,
 *  counters cancelling on placement, which is what a signed integer is.
 *  Neutral is the state's own baseline, not purple: the board tracks
 *  deviation only, exactly as Cook PVI does. */
                                                       

                                          

                             
                                                    
                       
                                        
                                        
                           
                  
 

function sign(p       )         { return p === 'R' ? 1 : p === 'D' ? -1 : 0; }

function pushForMargin(cfg            , marginPips        )         {
  for (const row of cfg.pushByMargin) if (marginPips <= row.maxPips) return row.push;
  return cfg.pushByMargin[cfg.pushByMargin.length - 1].push;
}

/** §10: the most nationalized race on the ballot pushes. Governors never reach
 *  the top of this ordering in an election year, which is why they never push
 *  -- the exclusion falls out of the priority rule rather than being asserted. */
const PRIORITY           = ['president', 'senator', 'representative', 'governor'];

function nationalizedRace                              (races     )                {
  for (const office of PRIORITY) {
    const hit = races.filter((r) => r.office === office);
    if (hit.length) return hit[0];
  }
  return undefined;
}

function applyPush(
  lean      , cfg            , state        , winner       , office        , marginPips        ,
)         {
  if (office === 'governor') {
    if (cfg.governorPushes === 'never') return 0;
    // 'with-lean': a governor pushes only when winning WITH the existing lean,
    // never against it (§10, "the alternative under test").
    const cur = lean[state] ?? 0;
    if (cur === 0 || Math.sign(cur) !== sign(winner)) return 0;
  }
  const push = pushForMargin(cfg, marginPips) * sign(winner);
  const before = lean[state] ?? 0;
  lean[state] = clampLean(before + push, cfg.maxLean);
  return lean[state] - before;
}

/** Decay removes one counter from every state, toward zero. §10: it happens at
 *  the top of the year, so the board players see when they declare is already
 *  decayed -- and pushes land later, on election night. */
function decay(lean      , cfg            , year        )       {
  if (cfg.decayFrequency === 'biennial' && year % 2 !== 0) return;
  for (const st of Object.keys(lean)) {
    const v = lean[st];
    if (v === 0) continue;
    lean[st] = v > 0 ? Math.max(0, v - cfg.decayPerTick) : Math.min(0, v + cfg.decayPerTick);
  }
}

/** The honeymoon: a newly elected president places one counter in every state
 *  carried. Removed at the next decay, so the incoming party enters the midterm
 *  with a fleeting map advantage immediately before the -2 lands on them. */
function honeymoon(lean      , cfg            , carried          , party       )       {
  for (const st of carried) lean[st] = clampLean((lean[st] ?? 0) + cfg.honeymoonCounter * sign(party), cfg.maxLean);
}

function clampLean(v        , max        )         { return Math.max(-max, Math.min(max, v)); }


// ---- engine/rules/economy.ts ----
/** The macro layer — design doc §13. One number for how the country is doing,
 *  one accumulated-spending track, and a 2d6 roll-under that decides when the
 *  Fed tightens. There is deliberately no second ideological axis. */
                                    

                                
                                          
                                        
                             
                  
                            
                             
                    
 

                                                                                        

function newEconomy(cfg               )          {
  return { level: cfg.start, accumulatedG: 0 };
}

/** §13: "the economy random-walks with memory". The walk is small relative to
 *  spending and tightening, so policy is legible against the noise. */
function walk(e         , cfg               , rng     )         {
  const step = rng.d6() <= 3 ? -1 : 1;
  const before = e.level;
  e.level = clampEcon(e.level + step + cfg.walkDrift, cfg.min, cfg.max);
  return e.level - before;
}

/** Spending pushes the economy up and loads the track that the Fed reads. */
function spend(e         , cfg               , g        )       {
  e.accumulatedG = Math.max(0, e.accumulatedG + g);
  // Austerity (negative G) cools directly; spending warms.
  e.level = clampEcon(e.level + Math.sign(g) * (Math.abs(g) >= 4 ? 2 : 1), cfg.min, cfg.max);
}

/** §13: 2d6 roll-under against the accumulation. G12 is a certainty; the
 *  interesting range is 6 to 8, where the curve is steepest -- which is
 *  exactly where a player trying to run hot will hover. */
function fedCheck(e         , cfg               , rng     )                                      {
  let roll = 0;
  for (let i = 0; i < cfg.fedDice; i++) roll += rng.d6();
  const rateRise = roll <= e.accumulatedG;
  if (rateRise) {
    e.accumulatedG = Math.max(0, e.accumulatedG - cfg.rateRiseSpendDown);
    e.level = clampEcon(e.level + cfg.rateRiseEconomyHit, cfg.min, cfg.max);
  }
  return { roll, rateRise };
}

/** Exact probability the Fed tightens at a given accumulation, 2d6 roll-under. */
function rateRiseOdds(accumulatedG        , dice = 2)         {
  let ways = 0, total = 0;
  const counts = new Map                ();
  const rec = (d        , sum        ) => {
    if (d === 0) { counts.set(sum, (counts.get(sum) ?? 0) + 1); return; }
    for (let f = 1; f <= 6; f++) rec(d - 1, sum + f);
  };
  rec(dice, 0);
  for (const [sum, n] of counts) { total += n; if (sum <= accumulatedG) ways += n; }
  return ways / total;
}

/** §9's national modifier from the economy, applied to the president's party.
 *  Asymmetric on purpose: voters punish downturns harder than they reward booms. */
function economyModifier(e         , cfg               , strong        , recession        )         {
  if (e.level >= cfg.strongAt) return strong;
  if (e.level <= cfg.recessionAt) return recession;
  return 0;
}

function clampEcon(v        , lo        , hi        )         { return Math.max(lo, Math.min(hi, v)); }


// ---- engine/rules/legislature.ts ----
/** The omnibill — design doc §12. One bill a year, a single number G, a House
 *  majority and 60% of the Senate, a veto, and an impeachment that replaces the
 *  bill outright. Scoring is by yes-vote, doubled for the majority party, which
 *  is what makes this a cooperation game with a defection option. */
                                                     
                                    

/** Thresholds are fractions, and two-thirds of nine is not representable.
 *  Every threshold comparison goes through this so a chamber that exactly
 *  meets a bar is never rejected by floating point. */
const EPS = 1e-9;
const atLeast = (part        , whole        , frac        ) => whole > 0 && part / whole >= frac - EPS;
const moreThan = (part        , whole        , frac        ) => whole > 0 && part / whole > frac + EPS;

                                    
                        
                        
                       
                           
                          
                             
                                    
 

                                                                                                           

                              
            
                  
                  
                      
                                       
                                         
                    
                         
                                 
                       
 

function chambers(seats        ) {
  const house = seats.filter((s) => s.office === 'representative' && s.holder);
  const senate = seats.filter((s) => s.office === 'senator' && s.holder);
  return { house, senate };
}

function majorityParty(seats        , office                              )                    {
  const held = seats.filter((s) => s.office === office && s.holder);
  const tally = new Map               ();
  for (const s of held) tally.set(s.holder .party, (tally.get(s.holder .party) ?? 0) + 1);
  let best                   , n = 0;
  for (const [p, c] of tally) if (c > n) { n = c; best = p; }
  return best;
}

/** §12: authorship goes to the player holding the largest bloc of the majority
 *  party in the House. */
function author(seats        )                     {
  const maj = majorityParty(seats, 'representative');
  if (!maj) return undefined;
  const tally = new Map                ();
  for (const s of seats) {
    if (s.office !== 'representative' || !s.holder || s.holder.party !== maj) continue;
    tally.set(s.holder.player, (tally.get(s.holder.player) ?? 0) + 1);
  }
  let best                    , n = 0;
  for (const [p, c] of tally) if (c > n) { n = c; best = p; }
  return best;
}

function tallyBill(
  cfg                   , seats        , votes        , g        ,
  president                                              ,
  vetoes         , overrideVotes                                               ,
  rng     ,
)              {
  const { house, senate } = chambers(seats);
  const houseYes = votes.filter((v) => v.office === 'representative' && v.yes).length;
  const senateYes = votes.filter((v) => v.office === 'senator' && v.yes).length;

  const carriedHouse = moreThan(houseYes, house.length, cfg.houseMajority);
  // The 60% Senate threshold is what makes cross-benching structurally
  // necessary rather than optional (§12).
  const carriedSenate = atLeast(senateYes, senate.length, cfg.senatePassage);
  let passed = carriedHouse && carriedSenate;

  let overridden = false;
  const vetoed = passed && vetoes;
  if (vetoed) {
    passed = false;
    if (overrideVotes && house.length && senate.length) {
      overridden = atLeast(overrideVotes.house, house.length, cfg.vetoOverride)
        && atLeast(overrideVotes.senate, senate.length, cfg.vetoOverride);
      if (overridden) passed = true;
    }
  }

  const scores                         = {};
  let reaction                    , reactionGood                     ;
  if (passed) {
    // §7: the reaction rolls immediately on passage, long before the national die.
    reaction = rng.d6();
    reactionGood = reaction >= cfg.reactionGoodOnRollAtLeast;
    const majH = majorityParty(seats, 'representative');
    const majS = majorityParty(seats, 'senator');
    for (const v of votes) {
      if (!v.yes) continue;
      const maj = v.office === 'representative' ? majH : majS;
      const mult = v.party === maj ? cfg.majorityMultiplier : 1;
      scores[v.player] = (scores[v.player] ?? 0) + cfg.scorePerYesVote * mult;
    }
  }

  const majH = majorityParty(seats, 'representative');
  const majS = majorityParty(seats, 'senator');
  const crossBenched = votes.filter((v) => {
    const maj = v.office === 'representative' ? majH : majS;
    return v.yes && v.party !== maj;
  }).length;

  return {
    g, passed, vetoed, overridden,
    houseYes, houseTotal: house.length, senateYes, senateTotal: senate.length,
    reaction, reactionGood, scores, crossBenched,
  };
}

/** §12: impeachment replaces the omnibill for the year. Two-thirds of the
 *  Senate, and an impeached president leaves the game entirely -- the only
 *  permanent removal in the design. */
function impeach(cfg                   , seats        , yesVotes        )          {
  const { senate } = chambers(seats);
  return atLeast(yesVotes, senate.length, cfg.impeachThreshold);
}


// ---- engine/rules/elections.ts ----
/** Declaration, withdrawal, and the modifier stack — design doc §8 and §9.
 *
 *  §8 is the heart of the card economy. Withdrawal comes BEFORE reveal in the
 *  primary and BEFORE the national die in the general, so you pull out on
 *  incomplete information; by the time the arithmetic is knowable it is too
 *  late to run. That ordering is enforced structurally here: the withdrawal
 *  window is handed a `WithdrawalView`, which has no field that could carry a
 *  die, and the Wave counts its own rolls so a test can prove none were drawn.
 */
             
                                                                    
                           
                                    

                                                                                                  
                                 
                                                                   
                                                  
 
                                       
                                                     
                                                                    
 

                              
               
                 
                
                
                                            
               
                     
                              
                         
                     
                                                                                  
                             
 

                              
                 
                      
                          
                 
                
                
                                                                               
                        
                      
                         
 

/** §5: district cards gate all races. You may run only where you hold a
 *  district card, or where your candidate is a native. This is the brake on
 *  wide-and-empty play. */
function eligible(card               , state        , districts                )          {
  return card.homeState === state || districts.some((d) => d.state === state);
}

function hasEffect(card               , t                           )          {
  return card.effects.some((e) => e.type === t);
}

function buildModifiers(
  d             , ctx             , round       ,
  res                  , nat                , pg                      ,
)             {
  const m             = [];
  const partySign = d.card.party === 'R' ? 1 : d.card.party === 'D' ? -1 : 0;

  // §10: the lean applies once, to the party it favours -- one counter is one
  // pip. Giving the other side the negative would double the scale.
  if (ctx.lean !== 0 && partySign !== 0 && Math.sign(ctx.lean) === partySign) {
    m.push({ source: 'state lean', pips: Math.abs(ctx.lean) });
  }

  if (d.card.homeState === ctx.state && d.card.homeStateBonus) {
    m.push({ source: 'home state', pips: d.card.homeStateBonus });
  }

  if (d.district && d.district.state === ctx.state) {
    m.push({ source: `district ${d.district.id}`, pips: d.district.synergy });
    const shared = d.card.identities.filter((i) => d.district .demographics.includes(i));
    if (shared.length) {
      m.push({ source: `identity: ${shared.join(', ')}`, pips: res.identityBonus * shared.length });
    }
  }

  if (d.incumbent) m.push({ source: 'incumbency', pips: res.incumbency });

  if (round === 'primary') {
    if (d.endorsements) m.push({ source: 'endorsements', pips: d.endorsements });
    if (hasEffect(d.card, 'extremist')) m.push({ source: 'extremist (primary)', pips: pg.extremistPrimary });
    if (hasEffect(d.card, 'heterodox')) m.push({ source: 'heterodox (primary)', pips: pg.heterodoxPrimaryPenalty });
    if (d.crossBenched) m.push({ source: 'cross-benched', pips: pg.crossBenchPrimaryPenalty });
  } else {
    if (hasEffect(d.card, 'extremist')) m.push({ source: 'extremist (general)', pips: pg.extremistGeneral });

    // National modifiers. `national: true` is precisely the set a heterodox
    // candidate ignores (§9) -- the tide, never the noise.
    if (ctx.presidentParty === d.card.party) {
      if (ctx.isMidterm) m.push({ source: 'midterm', pips: nat.midtermPenalty, national: true });
      if (ctx.economyMod) m.push({ source: 'economy', pips: ctx.economyMod, national: true });
    }
    if (ctx.isPresidentialYear && ctx.presidentialWinner && d.office !== 'president' && partySign !== 0) {
      // Turnout coattails: +1 down-ballot in states leaning your way, -1
      // against. Reverse coattails fall out for free.
      const leaningWith = Math.sign(ctx.lean) === partySign;
      if (d.card.party === ctx.presidentialWinner) {
        m.push({ source: 'coattails', pips: leaningWith ? nat.coattailsWith : nat.coattailsAgainst, national: true });
      }
    }
  }

  for (const e of d.card.effects) {
    if (e.type === 'conditional' && e.pips) {
      const w = e.when ?? {};
      if ((w.state && w.state !== ctx.state) || (w.round && w.round !== round) || (w.office && w.office !== d.office)) continue;
      m.push({ source: e.note ?? 'card text', pips: e.pips });
    }
  }

  return m;
}

function toSide(d             , modifiers            )       {
  return {
    player: d.player, cardId: d.card.id, party: d.card.party,
    modifiers, heterodox: hasEffect(d.card, 'heterodox'),
  };
}

/** What a player may look at when deciding to withdraw. Deliberately narrow:
 *  no dice, and in the primary not even the opponent's card. §8. */
                                 
               
                 
                
               
                                                                                
                     
                                                                       
                          
                          
                                                   
                                                     
 

                                                                

function withdrawalView(
  d             , modifiers            , round       , ctx             ,
  others               ,
)                 {
  return {
    round, office: ctx.office, state: ctx.state, year: ctx.year,
    contenders: others.length,
    myModifiers: modifiers,
    myModifierTotal: modifiers.reduce((n, x) => n + x.pips, 0),
    opponentCards: round === 'general'
      ? others.map((o) => ({ cardId: o.card.id, party: o.card.party }))
      : undefined,
  };
}

                              
                   
               
                              
                                                         
                                                                       
             
           
 

/** The ordering §8 depends on: build stacks, open the withdrawal window,
 *  close it, and only then touch the dice. Nothing between `decide` and
 *  `resolveRace` may consult the wave. */
function runRace(a             ) {
  const stacks = a.declarations.map((d) => buildModifiers(d, a.ctx, a.round, a.res, a.nat, a.pg));

  const withdrawn = new Set        ();
  a.declarations.forEach((d, i) => {
    const others = a.declarations.filter((_, j) => j !== i);
    const v = withdrawalView(d, stacks[i], a.round, a.ctx, others);
    if (a.decide(d.player, v)) withdrawn.add(i);
  });

  const running = a.declarations.map((d, i) => ({ d, i })).filter(({ i }) => !withdrawn.has(i));
  const withdrawnCards = [...withdrawn].map((i) => a.declarations[i]);

  if (running.length === 0) return { event: undefined, withdrawnCards, walkover: undefined };

  const event = resolveRace({
    year: a.ctx.year, round: a.round, office: a.ctx.office, state: a.ctx.state, slot: a.ctx.slot,
    sides: running.map(({ d, i }) => toSide(d, stacks[i])),
    wave: a.wave, rng: a.rng,
  });
  return { event, withdrawnCards, walkover: running.length === 1 ? running[0].d : undefined };
}



// ---- engine/game.ts ----
/** The game — design doc §7's annual tick, wired to the rule modules.
 *
 *  Players are not parties. A player is a faction holding cards of both
 *  parties (§13: "a skilled player runs one party hot and pivots to the other
 *  in the recession year"), so score is per player and party is per card.
 *
 *  The board starts empty and fills as seats are won. Chamber majorities are
 *  computed over HELD seats only, which is what makes a legislature possible
 *  at all when a table of four holds thirty seats between them.
 */
             
                                                                    
                          

                         
               
                                                                                                                           
                                                                              
                                                                                                                                  
                                                                                
                                                                                                                                            
                        
                              
                                     
                                                                                   
                                                                                       
 

                              
             
               
               
                            
                
                                                                      
                      
 

                           
               
                          
                     
                              
                        
                  
                
                         
             
                         
 

                        
               
                                                                              
                                                                             
                                                                     
                                       
                                                                               
                                                               
                                       
                                                                   
                                
                                                        
                                        
 

                       
                                                       
                                                                   
                                                                                                      
                                                                      

                                                                                                         

const raceKeyOf = (d                                                  ) => `${d.office}|${d.state}|${d.slot ?? ''}`;
const sameRace = (a                                                  , b                                                  ) =>
  raceKeyOf(a) === raceKeyOf(b);

                                                                                            
/** A peg on the board: the race is contested, the card is not visible. */
                                                                                                           

                             
               
                 
                
                   
                 
                      
                                                                          
                            
                      
                      
                         
                          
                       
                    
                       
                           
                                                                             
                             
                           
                                        
 

class Game {
  cfg        ; rng     ; players               ; seats         = [];
  leanMap            = {}; economy              ;
  year        ; talon         = []; discard         = []; eraQueue           = [];
  president                                                                  ;
  events              = [];
  log           = [];
  stats = { billsPassed: 0, billsAttempted: 0, crossBench: 0, impeachments: 0, rateRises: 0,
            decisions: []            ,
            /** race-slots offered, and those drawing declarations from >1 player.
             *  Counting "uncontested generals" instead undercounts badly: a race
             *  several players crowd in one party resolves as a contested PRIMARY
             *  and a one-candidate general. */
            raceSlots: 0, contestedSlots: 0 };
          agents         ;
          scoreHistory             = [];

  constructor(agents         , cards        , cfg        , seed        ) {
    this.cfg = cfg; this.rng = new RNG(seed); this.agents = agents;
    this.year = cfg.game.startYear;
    this.economy = econ.newEconomy(cfg.economy);
    this.players = agents.map((a, i) => ({ id: i, name: a.name, hand: [], districts: [], score: 0, tapped: new Set() }));
    for (const s of STATES) this.leanMap[s.code] = 0;
    // §14: "refill packs draw from later years", so a game beginning in 1976
    // is playing 2010s cards by year ten. The talon is therefore era-ordered,
    // not shuffled together: each era is shuffled within itself and they are
    // consumed oldest first. This also concentrates presence early, when the
    // pool is one era's ~24 states rather than four eras' fifty.
    const eras = [...new Set(cards.map((c) => c.era))].sort((a, b) => a - b);
    this.eraQueue = eras.map((e) => this.rng.shuffle(cards.filter((c) => c.era === e)));
    this.talon = this.eraQueue.shift() ?? [];
    this.deal();
  }

  /** §6/§11: the office bonuses are per OFFICE HELD, not per seat. The doc's
   *  own arithmetic fixes this -- "base 12 with president +2 is a 17% edge"
   *  is 2/12, a one-off. Read per seat, a player holding twenty Senate seats
   *  draws thirty-two cards a cycle, which both runs away and exhausts the
   *  talon: game length collapsed from 24 years to 7 before this was fixed. */
          handSize(p             )         {
    const h = this.cfg.hand;
    const holds = (o        ) => this.seats.some((s) => s.holder?.player === p.id && s.office === o);
    return h.base
      + (holds('president') ? h.bonusPresident : 0)
      + (holds('senator') ? h.bonusSenator : 0)
      + (holds('governor') ? h.bonusGovernor : 0)
      + (holds('representative') ? h.bonusRepresentative : 0);
  }

          draw(p             , n        )       {
    for (let i = 0; i < n; i++) {
      if (!this.talon.length) {
        // The next era enters play before the discard is recycled -- that is
        // what puts 2010s districts under 1970s politicians (§14).
        if (this.eraQueue.length) this.talon = this.eraQueue.shift() ;
        else if (this.discard.length) { this.talon = this.rng.shuffle(this.discard); this.discard = []; }
        else return;                                 // §14: the deck-out ending
      }
      const c = this.talon.pop() ;
      if (c.kind === 'district') p.districts.push(c); else p.hand.push(c);
    }
  }

          deal()       { for (const p of this.players) this.draw(p, this.handSize(p)); }

  /** total cards held: candidates in hand plus districts in play */
  held(p             )         { return p.hand.length + p.districts.length; }

          openRaces()             {
    const out             = [];
    const y = this.year;
    if (y % 4 === 0) out.push({ office: 'president', state: 'US' });
    for (const s of STATES) {
      for (const cls of senateUp(s, y)) {
        out.push({ office: 'senator', state: s.code, slot: cls, incumbent: this.seatFor('senator', s.code, cls) });
      }
      if (governorUp(s, y)) out.push({ office: 'governor', state: s.code, incumbent: this.seatFor('governor', s.code) });
    }
    // §2: the board prints no districts. A House race therefore exists only
    // where a district CARD is in play -- the House map IS the set of drafted
    // districts, which is also what makes §15's capture coherent (you take the
    // seat by taking the card). Opening all 435 seats instead leaves the map so
    // sparse that players never meet, and the game becomes solitaire.
    const inPlay = new Map                                           ();
    for (const p of this.players) for (const d of p.districts) inPlay.set(d.id, d);
    for (const d of inPlay.values()) {
      out.push({ office: 'representative', state: d.state, slot: d.number,
                 incumbent: this.seatFor('representative', d.state, d.number) });
    }
    return out;
  }

          seatFor(office        , state        , slot         )                   {
    return this.seats.find((s) => s.office === office && s.state === state && s.slot === slot && s.holder);
  }

          view(me        )           {
    return {
      year: this.year,
      isElectionYear: this.year % 2 === 0,
      isMidterm: this.year % 4 === 2,
      isPresidentialYear: this.year % 4 === 0,
      economy: this.economy, lean: this.leanMap, seats: this.seats,
      players: this.players, me, presidentParty: this.president?.party,
    };
  }

  // ---- §7 step 2-3: the omnibill -------------------------------------------
          omnibill(human = -1, humanG         , humanYes          )       {
    const authorId = leg.author(this.seats);
    if (authorId === undefined) return;
    this.stats.billsAttempted++;
    const proposed = authorId === human && humanG !== undefined
      ? humanG : this.agents[authorId].proposeG(this.view(authorId));
    const g = clampInt(proposed, this.cfg.economy.gMin, this.cfg.economy.gMax);

    const votes             = [];
    for (const s of this.seats) {
      if (!s.holder || (s.office !== 'senator' && s.office !== 'representative')) continue;
      const yes = s.holder.player === human && humanYes !== undefined
        ? humanYes : this.agents[s.holder.player].voteBill(this.view(s.holder.player), g, s);
      votes.push({ player: s.holder.player, party: s.holder.party, office: s.office, yes });
    }

    const pres = this.president;
    const wouldPass = leg.tallyBill(this.cfg.legislature, this.seats, votes, g, pres, false, undefined, this.rng);
    const vetoes = !!pres && wouldPass.passed && this.agents[pres.player].veto(this.view(pres.player), g);
    const override = vetoes
      ? { house: votes.filter((v) => v.office === 'representative' && v.yes).length,
          senate: votes.filter((v) => v.office === 'senator' && v.yes).length }
      : undefined;

    const out = leg.tallyBill(this.cfg.legislature, this.seats, votes, g, pres, vetoes, override, this.rng);
    this.stats.crossBench += out.crossBenched;
    if (out.passed) {
      this.stats.billsPassed++;
      for (const [p, n] of Object.entries(out.scores)) this.players[Number(p)].score += n;
      econ.spend(this.economy, this.cfg.economy, g);
      this.log.push(`${this.year}: omnibill G${g} passed ${out.houseYes}/${out.houseTotal} H, ${out.senateYes}/${out.senateTotal} S`);
    } else {
      this.log.push(`${this.year}: omnibill G${g} ${out.vetoed ? 'vetoed' : 'failed'}`);
    }
  }

  // ---- §7 steps 6-9: the elections -----------------------------------------
          elections()       {
    const wave = new Wave(this.rng);
    const open = this.openRaces();
    const decls                = [];
    const pending               = [];
    // §8: sequential around the table, and the order rotates each cycle so
    // going last is not a permanent tax.
    const order = this.players.map((_, i) => (i + (this.year / 2)) % this.players.length);
    for (const i of order) {
      const mine = this.agents[i].declare(this.view(i), open, pending);
      this.stats.decisions.push(mine.length);
      for (const d of mine) {
        const p = this.players[i];
        if (!p.hand.some((c) => c.kind === 'candidate' && c.id === d.card.id)) continue;
        if (d.office !== 'president' && !eligible(d.card, d.state, p.districts)) continue;
        decls.push({ ...d, player: i });
        pending.push({ player: i, office: d.office, state: d.state, slot: d.slot, party: d.card.party });
      }
    }
    this.resolveDeclared(decls, wave, -1);
  }

  /** Everything after declaration: primaries, generals, seating, capture and
   *  the lean pushes. Shared by the headless tick and the interactive one so
   *  the rules exist exactly once. */
          resolveDeclared(decls               , wave      , human        )       {
    const presidential = decls.filter((d) => d.office === 'president');
    const presidentialWinner = presidential.length ? this.presidentialRace(presidential, wave, human) : undefined;

    const byRace = new Map                       ();
    for (const d of decls) {
      if (d.office === 'president') continue;
      const k = raceKeyOf(d);
      if (!byRace.has(k)) byRace.set(k, []);
      byRace.get(k) .push(d);
    }
    for (const [, group] of byRace) {
      this.stats.raceSlots++;
      if (new Set(group.map((d) => d.player)).size > 1) this.stats.contestedSlots++;
    }

    const results                                        = [];
    for (const [key, group] of byRace) {
      const [office, state, slotStr] = key.split('|');
      const slot = slotStr ? Number(slotStr) : undefined;
      const incumbent = this.seatFor(office          , state, slot);
      const ctx = this.raceContext(office          , state, slot, presidentialWinner);

      const nominees = this.runPrimaries(group, ctx, wave, human);
      if (!nominees.length) continue;
      for (const d of nominees) d.incumbent = !!incumbent && incumbent.holder .cardId === d.card.id;

      const out = runRace({
        ctx, round: 'general', declarations: nominees, wave, rng: this.rng,
        res: this.cfg.resolution, nat: this.cfg.national, pg: this.cfg.primaryGeneral,
        decide: (p, v) => this.decideWithdraw(p, v, nominees, human),
      });
      for (const w of out.withdrawnCards) this.returnToHand(w);
      if (!out.event) continue;
      this.events.push(out.event);

      const won = nominees.find((d) => d.player === out.event .winner) ;
      results.push({ ev: out.event, won });
      for (const d of nominees) if (d.player !== out.event.winner) this.discardCard(d);
      this.seat(office          , state, slot, won);
      if (office === 'representative') this.capture(won, state);
    }

    this.pushLean(results);
  }

  /** The human's withdrawal answers were collected before any die was drawn;
   *  everyone else asks their agent. */
          decideWithdraw(p        , v                , group               , human        )          {
    if (p === human) {
      const mine = group.find((d) => d.player === human);
      if (mine) return this.humanWithdrawals.get(raceKeyOf(mine) + '|' + mine.card.id) ?? false;
      return false;
    }
    return this.agents[p].withdraw(v);
  }

          raceContext(office        , state        , slot                    , presidentialWinner        )              {
    return {
      year: this.year, office, state, slot,
      lean: this.leanMap[state] ?? 0,
      isMidterm: this.year % 4 === 2,
      isPresidentialYear: this.year % 4 === 0,
      presidentParty: this.president?.party,
      economyMod: econ.economyModifier(this.economy, this.cfg.economy, this.cfg.national.strongEconomy, this.cfg.national.recession),
      presidentialWinner,
    };
  }

  /** §11: nomination is a national primary, so only two cards reach the general
   *  regardless of table size. The general then runs state by state -- which is
   *  what produces the states carried that the honeymoon counter needs, and
   *  what makes the map worth holding. */
          presidentialRace(declarations               , wave      , human = -1)                    {
    const natCtx = this.raceContext('president', 'US', undefined);
    const nominees = this.runPrimaries(declarations, natCtx, wave, human);
    if (!nominees.length) return undefined;

    const tally = new Map                ();
    const carried = new Map                 ();
    for (const st of STATES) {
      const ctx = this.raceContext('president', st.code, undefined);
      const out = runRace({
        ctx, round: 'general', declarations: nominees, wave, rng: this.rng,
        res: this.cfg.resolution, nat: this.cfg.national, pg: this.cfg.primaryGeneral,
        decide: () => false,   // the ticket is committed; you cannot withdraw a state at a time
      });
      if (!out.event) continue;
      this.events.push(out.event);
      const won = nominees.find((d) => d.player === out.event .winner) ;
      tally.set(won.player, (tally.get(won.player) ?? 0) + electors(st, this.year));
      const list = carried.get(won.card.party) ?? [];
      list.push(st.code);
      carried.set(won.card.party, list);
    }
    if (!tally.size) return undefined;

    let best = -1, bestEV = -1;
    for (const [player, ev] of tally) if (ev > bestEV) { bestEV = ev; best = player; }
    const winner = nominees.find((d) => d.player === best) ;
    for (const d of nominees) if (d.player !== best) this.discardCard(d);
    this.seat('president', 'US', undefined, winner);
    this.log.push(`${this.year}: ${winner.card.name} (${winner.card.party}) wins with ${bestEV} electoral votes`);

    // §10: the honeymoon. One counter in every state carried, removed at the
    // next decay -- so the incoming party enters the midterm with a fleeting
    // map advantage immediately before the -2 lands on them.
    lean.honeymoon(this.leanMap, this.cfg.lean, carried.get(winner.card.party) ?? [], winner.card.party);
    return winner.card.party;
  }

          runPrimaries(group               , ctx             , wave      , human = -1)                {
    const byParty = new Map                      ();
    for (const d of group) {
      if (!byParty.has(d.card.party)) byParty.set(d.card.party, []);
      byParty.get(d.card.party) .push(d);
    }
    const winners                = [];
    for (const [party, cands] of byParty) {
      if (party === 'I') { winners.push(...cands); continue; }  // §9: independents skip the primary
      if (cands.length === 1) { winners.push(cands[0]); continue; }
      const out = runRace({
        ctx, round: 'primary', declarations: cands, wave, rng: this.rng,
        res: this.cfg.resolution, nat: this.cfg.national, pg: this.cfg.primaryGeneral,
        decide: (p, v) => this.decideWithdraw(p, v, cands, human),
      });
      for (const w of out.withdrawnCards) this.returnToHand(w);
      if (!out.event) continue;
      this.events.push(out.event);
      const w = cands.find((d) => d.player === out.event .winner);
      if (w) winners.push(w);
      // §8: primary loss returns the card to hand. Cheap to enter; the cost is
      // that you revealed it.
      for (const d of cands) if (d.player !== out.event .winner) this.returnToHand(d);
    }
    return winners;
  }

          pushLean(results                                       )       {
    const byState = new Map                                                            ();
    for (const r of results) {
      const st = r.ev.state;
      if (st === 'US') continue;
      if (!byState.has(st)) byState.set(st, []);
      byState.get(st) .push({ office: r.ev.office, party: r.won.card.party, margin: r.ev.margin });
    }
    for (const [st, races] of byState) {
      const top = lean.nationalizedRace(races);
      if (!top) continue;
      lean.applyPush(this.leanMap, this.cfg.lean, st, top.party, top.office, top.margin);
    }
  }

          seat(office        , state        , slot                    , d             )       {
    const existing = this.seats.find((s) => s.office === office && s.state === state && s.slot === slot);
    const holder = { cardId: d.card.id, player: d.player, party: d.card.party, since: this.year };
    if (existing) existing.holder = holder;
    else this.seats.push({ office, state, slot, senateClass: office === 'senator' ? (slot             ) : undefined, holder });
    if (office === 'president') this.president = { ...holder };
    const p = this.players[d.player];
    p.hand = p.hand.filter((c) => !(c.kind === 'candidate' && c.id === d.card.id));
    p.score += office === 'president' ? 5 : office === 'senator' ? 3 : office === 'governor' ? 2 : 1;
  }

  /** §15: winning a House seat transfers the district card to the winner. */
          capture(won             , state        )       {
    for (const p of this.players) {
      if (p.id === won.player) continue;
      const i = p.districts.findIndex((d) => d.state === state);
      if (i >= 0) { this.players[won.player].districts.push(p.districts.splice(i, 1)[0]); return; }
    }
  }

          returnToHand(d             )       {
    const p = this.players[d.player];
    if (!p.hand.some((c) => c.kind === 'candidate' && c.id === d.card.id)) {
      p.hand.push({ kind: 'candidate', ...d.card });
    }
  }

          discardCard(d             )       {
    const p = this.players[d.player];
    p.hand = p.hand.filter((c) => !(c.kind === 'candidate' && c.id === d.card.id));
    this.discard.push({ kind: 'candidate', ...d.card });
  }

  /** The interactive tick. Identical rules to `tick()`, but it yields at the
   *  two moments a human must act: choosing declarations, and the withdrawal
   *  window. Written as a generator so the UI can drive the engine without the
   *  engine knowing a UI exists, and without a second copy of the rules.
   *
   *  The withdrawal yield happens BEFORE any die is drawn -- the same ordering
   *  `runRace` enforces for the agents (§8). */
  *interactiveTick(human        )                                       {
    for (const p of this.players) p.tapped.clear();
    this.omnibillInteractive(human, yield* this.askBill(human));
    const fed = econ.fedCheck(this.economy, this.cfg.economy, this.rng);
    if (fed.rateRise) { this.stats.rateRises++; this.log.push(`${this.year}: the Fed tightens`); }
    econ.walk(this.economy, this.cfg.economy, this.rng);
    lean.decay(this.leanMap, this.cfg.lean, this.year);

    if (this.year % 2 === 0) {
      const open = this.openRaces();
      const answer = yield { kind: 'declare', year: this.year, open };
      this.humanDeclarations = answer.declarations ?? [];
      yield* this.electionsInteractive(human);
      for (const p of this.players) {
        const want = this.handSize(p) - p.hand.length - p.districts.length;
        if (want > 0) this.draw(p, want);
      }
    }
    this.scoreHistory.push(this.players.map((p) => p.score));
    this.year++;
  }

          humanDeclarations                = [];
          humanWithdrawals = new Map                 ();

  ;       *askBill(human        )                                                                {
    const authorId = leg.author(this.seats);
    if (authorId === undefined) return {};
    const holdsSeat = this.seats.some((s) => s.holder?.player === human && (s.office === 'senator' || s.office === 'representative'));
    if (authorId !== human && !holdsSeat) return {};
    const a = yield { kind: 'bill', year: this.year, isAuthor: authorId === human, votes: holdsSeat };
    return { g: a.g, yes: a.yes };
  }

          omnibillInteractive(human        , a                               )       {
    this.omnibill(human, a.g, a.yes);
  }

  ;       *electionsInteractive(human        )                                       {
    // Collect every declaration first, so the human can see the pegs go down.
    const wave = new Wave(this.rng);
    const open = this.openRaces();
    const decls                = [];
    const pending               = [];
    const order = this.players.map((_, i) => (i + (this.year / 2)) % this.players.length);
    for (const i of order) {
      const mine = i === human ? this.humanDeclarations : this.agents[i].declare(this.view(i), open, pending);
      this.stats.decisions.push(mine.length);
      for (const d of mine) {
        const p = this.players[i];
        if (!p.hand.some((c) => c.kind === 'candidate' && c.id === d.card.id)) continue;
        if (d.office !== 'president' && !eligible(d.card, d.state, p.districts)) continue;
        decls.push({ ...d, player: i });
        pending.push({ player: i, office: d.office, state: d.state, slot: d.slot, party: d.card.party });
      }
    }

    // The withdrawal window, before any die is drawn.
    this.humanWithdrawals.clear();
    const mineContested = decls.filter((d) => d.player === human)
      .map((d) => ({ d, others: decls.filter((o) => o !== d && sameRace(o, d)) }))
      .filter((x) => x.others.length > 0);
    for (const { d, others } of mineContested) {
      const ctx = this.raceContext(d.office, d.state, d.slot);
      const round = others.some((o) => o.card.party === d.card.party) ? 'primary' : 'general';
      const mods = buildModifiers(d, ctx, round, this.cfg.resolution, this.cfg.national, this.cfg.primaryGeneral);
      const a = yield {
        kind: 'withdraw', year: this.year, round,
        view: withdrawalView(d, mods, round, ctx, others),
        race: { office: d.office, state: d.state, slot: d.slot, cardName: d.card.name },
      };
      this.humanWithdrawals.set(raceKeyOf(d) + '|' + d.card.id, !!a.withdraw);
    }

    this.resolveDeclared(decls, wave, human);
  }

  /** One annual tick — §7. */
  tick()       {
    for (const p of this.players) p.tapped.clear();      // 1. action phase
    this.omnibill();                                     // 2-3. bill and reaction
    const fed = econ.fedCheck(this.economy, this.cfg.economy, this.rng);  // 4.
    if (fed.rateRise) this.stats.rateRises++;
    econ.walk(this.economy, this.cfg.economy, this.rng);
    lean.decay(this.leanMap, this.cfg.lean, this.year);  // 5.

    if (this.year % 2 === 0) {
      this.elections();                                  // 6-9.
      for (const p of this.players) {                    // 10. refill
        // §5: "presence is scarce and must be purchased in the draft." A
        // district you keep is a candidate you do not hold, so hand size caps
        // TOTAL cards. Refilling on candidates alone makes presence free, and
        // free presence puts five times more races on the board than there are
        // declarations to fill them -- which is what turns the game solitaire.
        const want = this.handSize(p) - p.hand.length - p.districts.length;
        if (want > 0) this.draw(p, want);
      }
    }
    this.scoreHistory.push(this.players.map((p) => p.score));
    this.year++;
  }

  run()             {
    const end = this.cfg.game.startYear + this.cfg.game.maxYears;
    while (this.year < end) {
      this.tick();
      if (this.cfg.game.deckOutEnds && !this.talon.length && !this.discard.length && !this.eraQueue.length) break;
    }
    return this.result();
  }

          result()             {
    const scores = this.players.map((p) => p.score);
    const winner = scores.indexOf(Math.max(...scores));
    let leadChanges = 0, prev = -1, determination = 0;
    this.scoreHistory.forEach((row, i) => {
      const lead = row.indexOf(Math.max(...row));
      if (prev !== -1 && lead !== prev) leadChanges++;
      if (lead !== winner) determination = i + 1;
      prev = lead;
    });
    const seatsByOffice = { president: 0, senator: 0, governor: 0, representative: 0 }                          ;
    for (const s of this.seats) if (s.holder) seatsByOffice[s.office]++;
    const uncontested = this.events.filter((e) => e.uncontested).length;
    return {
      seed: 0, config: this.cfg.name, years: this.year - this.cfg.game.startYear,
      scores, winner, leadChanges,
      determinationYear: determination,
      events: this.events,
      billsPassed: this.stats.billsPassed, billsAttempted: this.stats.billsAttempted,
      crossBenchVotes: this.stats.crossBench, impeachments: this.stats.impeachments,
      rateRises: this.stats.rateRises, finalLean: this.leanMap,
      uncontestedShare: this.events.length ? uncontested / this.events.length : 0,
      contestedSlotShare: this.stats.raceSlots ? this.stats.contestedSlots / this.stats.raceSlots : 0,
      decisionCounts: this.stats.decisions, seatsByOffice,
    };
  }
}

function clampInt(v        , lo        , hi        )         { return Math.max(lo, Math.min(hi, Math.round(v))); }


// ---- sim/agents.ts ----
/** Scripted agents. The first three measure skill signal; the rest are the
 *  strategies SIM-BRIEF §2 asks to be tested for dominance. Each also doubles
 *  as an opponent personality in the app. */
                                                                                       
                                                                                
                                                                            

                                                   

                                                                 

/** Every legal declaration this player could make, with its modifier edge.
 *  Agents differ only in how they score and cap this list. */
function options(v          , open            , cfg        )           {
  const me = v.players[v.me];
  const cands = me.hand.filter((c) => c.kind === 'candidate')                                             ;
  const out           = [];
  for (const r of open) {
    for (const card of cands) {
      if (r.office !== 'president' && !eligible(card, r.state, me.districts)) continue;
      const district = me.districts.find((d) => d.state === r.state);
      const d              = { player: v.me, card, district, office: r.office, state: r.state, slot: r.slot,
        incumbent: r.incumbent?.holder?.cardId === card.id };
      const ctx = {
        year: v.year, office: r.office, state: r.state, slot: r.slot,
        lean: v.lean[r.state] ?? 0, isMidterm: v.isMidterm, isPresidentialYear: v.isPresidentialYear,
        presidentParty: v.presidentParty,
        economyMod: 0,
      };
      const mods = buildModifiers(d, ctx, 'general', cfg.resolution, cfg.national, cfg.primaryGeneral);
      out.push({ d, office: r.office, edge: mods.reduce((n, m) => n + m.pips, 0) });
    }
  }
  return out;
}

const raceKey = (r                                                  ) => `${r.office}|${r.state}|${r.slot ?? ''}`;

/** §8: denial. Contesting a race someone else has declared costs a real card
 *  against someone who may have spent nothing -- which is the asymmetry that
 *  makes district gating necessary. An agent that never does this plays
 *  solitaire. */
function counterDeclare(
  opts          , pending              , me        , appetite        ,
)           {
  const contested = new Set(pending.filter((p) => p.player !== me).map(raceKey));
  return opts.map((o) => contested.has(raceKey(o.d)) ? { ...o, edge: o.edge + appetite } : o);
}

/** One card can only run once; one race is worth entering once. */
function pickDistinct(opts          , limit        )                {
  const usedCards = new Set        (), usedRaces = new Set        ();
  const out                = [];
  for (const o of opts) {
    const rk = `${o.d.office}|${o.d.state}|${o.d.slot ?? ''}`;
    if (usedCards.has(o.d.card.id) || usedRaces.has(rk)) continue;
    usedCards.add(o.d.card.id); usedRaces.add(rk);
    out.push(o.d);
    if (out.length >= limit) break;
  }
  return out;
}

const byEdge = (a        , b        ) => b.edge - a.edge;

         class Base                  {
  name        ; cfg        ; rng     ;
  constructor(name        , cfg        , rng     ) { this.name = name; this.cfg = cfg; this.rng = rng; }
                                                                                        
  /** Default: pull out only when the visible arithmetic is clearly against you.
   *  The dice are unknowable here by construction (§8). */
  withdraw(v                )          {
    return v.contenders > 0 && v.myModifierTotal <= -4;
  }
  proposeG(_v          )         { return 3; }
  voteBill(v          , _g        , seat      )          {
    return seat.holder?.party === this.majority(v);
  }
  veto(_v          , _g        )          { return false; }
            majority(v          )                     {
    const t = new Map                ();
    for (const s of v.seats) if (s.holder) t.set(s.holder.party, (t.get(s.holder.party) ?? 0) + 1);
    let best                    , n = 0;
    for (const [p, c] of t) if (c > n) { n = c; best = p; }
    return best;
  }
            budget(v          )         { return v.players[v.me].hand.length; }
}

class RandomAgent extends Base {
  declare(v          , open            , _pending              )                {
    const o = options(v, open, this.cfg);
    return pickDistinct(this.rng.shuffle(o), this.budget(v));
  }
  withdraw()          { return false; }
  proposeG()         { return 1 + this.rng.int(6); }
  voteBill()          { return this.rng.bool(); }
}

/** SIM-BRIEF's headline number: greedy takes the highest-edge race available. */
class GreedyAgent extends Base {
  declare(v          , open            , pending              )                {
    const o = counterDeclare(options(v, open, this.cfg), pending, v.me, 2);
    return pickDistinct(o.sort(byEdge), this.budget(v));
  }
}

/** Values a seat by what it pays over the terms it will be held, not just this
 *  cycle -- which is what "planning" means when terms are staggered. */
class LookaheadAgent extends Base {
  declare(v          , open            , pending              )                {
    const term                         = { president: 4, senator: 6, governor: 4, representative: 2 };
    const hand                         = {
      president: this.cfg.hand.bonusPresident, senator: this.cfg.hand.bonusSenator,
      governor: this.cfg.hand.bonusGovernor, representative: this.cfg.hand.bonusRepresentative,
    };
    const scored = counterDeclare(options(v, open, this.cfg), pending, v.me, 2).map((o) => {
      const pts = o.office === 'president' ? 5 : o.office === 'senator' ? 3 : o.office === 'governor' ? 2 : 1;
      // future value = points and hand size over the term, discounted by the
      // chance of actually winning it
      const win = 0.5 + 0.045 * o.edge;
      const value = win * (pts + term[o.office] * (hand[o.office] + (o.office === 'representative' ? 0.5 : 0)));
      return { ...o, edge: value };
    });
    return pickDistinct(scored.sort(byEdge), this.budget(v));
  }
}

/** Declare everywhere cheap, contest nothing. District gating is supposed to
 *  have killed this; SIM-BRIEF asks to confirm it stays dead. */
class WideAndEmpty extends Base {
  declare(v          , open            , pending              )                {
    const o = options(v, open, this.cfg).filter((x) => x.office === 'representative');
    void pending;   // WideAndEmpty contests nothing, by definition
    return pickDistinct(o.sort((a, b) => a.edge - b.edge), v.players[v.me].hand.length);
  }
  withdraw(v                )          { return v.contenders > 0; }
}

class SenateFlood extends Base {
  declare(v          , open            , pending              )                {
    const o = counterDeclare(options(v, open, this.cfg), pending, v.me, 2);
    const sen = o.filter((x) => x.office === 'senator').sort(byEdge);
    return pickDistinct([...sen, ...o.filter((x) => x.office !== 'senator').sort(byEdge)], this.budget(v));
  }
}

class HouseFarm extends Base {
  declare(v          , open            , pending              )                {
    const o = counterDeclare(options(v, open, this.cfg), pending, v.me, 3);
    const house = o.filter((x) => x.office === 'representative').sort(byEdge);
    return pickDistinct([...house, ...o.filter((x) => x.office !== 'representative').sort(byEdge)], this.budget(v) + 2);
  }
}

/** Draft only off-brand candidates for hostile states. */
class HeterodoxSpecialist extends Base {
  declare(v          , open            , pending              )                {
    const o = counterDeclare(options(v, open, this.cfg), pending, v.me, 2).map((x) => {
      const het = x.d.card.effects.some((e) => e.type === 'heterodox');
      const hostile = Math.sign(v.lean[x.d.state] ?? 0) === (x.d.card.party === 'R' ? -1 : 1);
      return { ...x, edge: x.edge + (het && hostile ? 6 : het ? 2 : 0) };
    });
    return pickDistinct(o.sort(byEdge), this.budget(v));
  }
}

class BillMaximizer extends Base {
  declare(v          , open            , pending              )                {
    const o = counterDeclare(options(v, open, this.cfg), pending, v.me, 2).map((x) => ({
      ...x, edge: x.edge + (x.office === 'representative' || x.office === 'senator' ? 4 : 0),
    }));
    return pickDistinct(o.sort(byEdge), this.budget(v));
  }
  voteBill()          { return true; }         // every yes-vote scores
  proposeG()         { return 4; }
}

class Impeacher extends Base {
  declare(v          , open            , pending              )                {
    const o = counterDeclare(options(v, open, this.cfg), pending, v.me, 2).map((x) => ({ ...x, edge: x.edge + (x.office === 'senator' ? 6 : 0) }));
    return pickDistinct(o.sort(byEdge), this.budget(v));
  }
}

/** Spend hot, get your candidate into position, be out of the way before the
 *  reckoning (§13). */
class EconomyChicken extends Base {
  declare(v          , open            , pending              )                {
    return pickDistinct(counterDeclare(options(v, open, this.cfg), pending, v.me, 2).sort(byEdge), this.budget(v));
  }
  proposeG(v          )         {
    return v.economy.accumulatedG >= 7 ? this.cfg.economy.gMin : this.cfg.economy.gMax;
  }
  voteBill(v          , g        )          { return g > 0 ? v.economy.accumulatedG < 8 : true; }
}

const AGENTS                                                       = {
  Random: class extends RandomAgent { constructor(c        , r     ) { super('Random', c, r); } },
  Greedy: class extends GreedyAgent { constructor(c        , r     ) { super('Greedy', c, r); } },
  Lookahead: class extends LookaheadAgent { constructor(c        , r     ) { super('Lookahead', c, r); } },
  WideAndEmpty: class extends WideAndEmpty { constructor(c        , r     ) { super('WideAndEmpty', c, r); } },
  SenateFlood: class extends SenateFlood { constructor(c        , r     ) { super('SenateFlood', c, r); } },
  HouseFarm: class extends HouseFarm { constructor(c        , r     ) { super('HouseFarm', c, r); } },
  HeterodoxSpecialist: class extends HeterodoxSpecialist { constructor(c        , r     ) { super('HeterodoxSpecialist', c, r); } },
  BillMaximizer: class extends BillMaximizer { constructor(c        , r     ) { super('BillMaximizer', c, r); } },
  Impeacher: class extends Impeacher { constructor(c        , r     ) { super('Impeacher', c, r); } },
  EconomyChicken: class extends EconomyChicken { constructor(c        , r     ) { super('EconomyChicken', c, r); } },
};

</script>
<script>
'use strict';
// American Cycle — hot-seat against the machine. Drives engine/game.ts's
// interactive generator; every rule lives in the engine, nothing is duplicated.

const TILES = {
  AK:[0,0],ME:[10,0], VT:[9,1],NH:[10,1],
  WA:[0,2],ID:[1,2],MT:[2,2],ND:[3,2],MN:[4,2],IL:[5,2],WI:[6,2],MI:[7,2],NY:[8,2],RI:[9,2],MA:[10,2],
  OR:[0,3],NV:[1,3],WY:[2,3],SD:[3,3],IA:[4,3],IN:[5,3],OH:[6,3],PA:[7,3],NJ:[8,3],CT:[9,3],
  CA:[0,4],UT:[1,4],CO:[2,4],NE:[3,4],MO:[4,4],KY:[5,4],WV:[6,4],VA:[7,4],MD:[8,4],DE:[9,4],
  AZ:[1,5],NM:[2,5],KS:[3,5],AR:[4,5],TN:[5,5],NC:[6,5],SC:[7,5],
  OK:[3,6],LA:[4,6],MS:[5,6],AL:[6,6],GA:[7,6],
  HI:[0,7],TX:[3,7],FL:[8,7],
};
const OFFICE_LABEL = {president:'President',senator:'Senate',governor:'Governor',representative:'House'};
const PLAYER_COLORS = ['#8A6D22','#2F5C8A','#A63A2E','#3E6B4F','#6B4E8A','#8A5A2F'];

const $ = (id) => document.getElementById(id);
const el = (t, cls, txt) => { const n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

let G = null, gen = null, pending = null, S = {
  sel: null, picks: [], human: 0, opponents: [], cfgName: 'tuned', seed: 1, over: false,
};

// ---- setup ------------------------------------------------------------------
const OPPONENT_BLURB = {
  Greedy:'Takes the best race on the board, every time. No plan beyond this cycle.',
  Lookahead:'Values a seat by what it pays over its whole term. Plans two cycles out.',
  Random:'Declares anywhere. Useful as a floor, not as a rival.',
  HouseFarm:'Builds district presence and promotes upward. Fights you for the map.',
  SenateFlood:'Runs everything for Senate early, for the six-year terms and the hand size.',
  HeterodoxSpecialist:'Drafts off-brand candidates and runs them in hostile states.',
  BillMaximizer:'Chases yes-votes and majority status. Votes for everything.',
  Impeacher:'Builds a Senate bloc large enough to remove a president.',
  EconomyChicken:'Spends hot, then pivots before the Fed tightens.',
  WideAndEmpty:'Declares everywhere cheap and contests nothing. Should be a losing strategy.',
};
const CONFIG_BLURB = {
  tuned:'The playable tuning. Bigger hand, thinner district supply — the settings that actually produce a contested board.',
  baseline:'The design doc as corrected: biennial decay, margin-based pushes, hand 12.',
  'as-written':'v0.2 exactly, with annual decay. The map cannot realign here at any margin — that is the point of including it.',
  'flat-push':'Flat +1 lean pushes, the rule that was cut. Win a state every cycle for a decade and move the map nowhere.',
  'governors-push':'Governors push lean when they win with the grain of the state, never against it.',
  brutal:'Large office bonuses. The leader compounds hard.',
};

function setup() {
  const opts = Object.keys(AGENTS).map((k) => `<option value="${k}">${k}</option>`).join('');
  const cfgs = Object.keys(CONFIGS).map((k) => `<option value="${k}"${k === 'tuned' ? ' selected' : ''}>${k}</option>`).join('');
  modal(`
    <h1 style="font-size:26px;letter-spacing:-.01em">American Cycle</h1>
    <p class="note" style="margin:6px 0 16px">Draft real politicians, run them across a decade of elections, and try to
      leave the map different from how you found it. You are one faction among several — you hold cards of
      both parties, and so does everyone else.</p>
    <div class="setup-grid">
      <label class="f">Opponent<select id="s1">${opts}</select><span class="note" id="b1"></span></label>
      <label class="f">Second opponent<select id="s2">${opts}</select><span class="note" id="b2"></span></label>
      <label class="f">Third opponent<select id="s3"><option value="">— none —</option>${opts}</select><span class="note" id="b3"></span></label>
      <label class="f">Rules<select id="scfg">${cfgs}</select><span class="note" id="bcfg"></span></label>
    </div>
    <div class="row" style="margin-top:14px">
      <label class="f">Seed<input type="number" id="sseed" value="${(Math.random()*9999)|0}" style="width:110px"></label>
    </div>
    <div class="row" style="margin-top:18px"><button class="btn" id="go">Open the cycle</button></div>
  `);
